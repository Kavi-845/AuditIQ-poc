name: Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      - name: Workflow Started
        run: echo "Code Review Workflow Triggered"
